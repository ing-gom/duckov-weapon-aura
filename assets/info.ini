displayName=Weapon Aura
description=Four grade-driven effects: an aura spreading off your weapon's surface, a tracer trail behind every bullet, a muzzle flash at the barrel, and a coloured melee slash with particles scattering along the swing. Guns read the grade of the ammo you have loaded; the aura and the melee slash read the grade of the weapon itself. Open Aura Settings from the pause menu and switch between the four tabs to pick colours with a real colour picker, watch live previews of the real effect, apply one of 12 elemental templates, and tune shape, sparks and trails. Every grade can be styled or switched off on its own, and any single weapon can carry its own settings instead of the grade's. Stack extra particle layers on the aura, the muzzle flash and the melee slash, and pick shapes as pictures from a browser that includes 52 bundled PNGs.

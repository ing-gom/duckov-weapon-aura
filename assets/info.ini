description=Three grade-driven effects: an aura spreading off your weapon's surface (by weapon grade), a tracer trail behind every bullet, and a muzzle flash at the barrel (both by the grade of the ammo you have loaded). Open Aura Settings from the pause menu and switch between the three tabs to pick colours with a real colour picker, watch live previews, apply one of 12 elemental templates, and tune shape, sparks and trails. Every grade can be styled or switched off on its own.
